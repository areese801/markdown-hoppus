[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdown-hoppus"
version = "0.1.0"
description = "A terminal-first, TUI Markdown knowledge base — Obsidian-compatible, standalone, MIT-licensed."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Reese" }]
keywords = ["markdown", "obsidian", "tui", "notes", "knowledge-base", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "textual>=0.86",
    "rich>=13.9",
    "markdown-it-py>=3.0",
    "ruamel.yaml>=0.18",
    "watchdog>=6.0",
    "rapidfuzz>=3.10",
    "pyperclip>=1.9",
    "typer>=0.15",
    "mcp>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

# Three interchangeable entry points into the same CLI (spec §1, §10).
[project.scripts]
hoppus = "hoppus:main"
mark = "hoppus:main"
hop = "hoppus:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hoppus"]

[tool.ruff]
line-length = 88
